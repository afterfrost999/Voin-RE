# ============================================================
#  공통 설정 (프로필 무관 — on-profile 없음, 항상 로드)
#  프로필 미지정 시 local 이 자동 활성화됨 (spring.profiles.default)
#  실제 시크릿 값은 환경변수로 주입: 로컬=IntelliJ Env, 서버=EnvironmentFile
# ============================================================
spring:
  application:
    name: voin
  profiles:
    default: local

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

  mvc:
    static-path-pattern: /**

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # Flyway 는 운영(prod)에서만 사용. 로컬/테스트는 JPA create-drop 유지
  flyway:
    enabled: false

server:
  port: 8080

jwt:
  # 아래 기본값은 실제 운영 시크릿이 아니라, env 미주입 시에도 앱이 기동되게 하는 개발용 더미(HS256 최소 32바이트).
  # 운영에서는 JWT_SECRET 환경변수로 반드시 덮어쓸 것.
  secret: ${JWT_SECRET:local-development-insecure-jwt-secret-override-in-production-0123456789}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  frontend-callback-uri: ${FRONTEND_CALLBACK_URI:https://localhost:5174/auth/callback}
  cors:
    # 허용할 프론트 출처(쉼표 구분). 운영은 APP_CORS_ALLOWED_ORIGINS 로 도메인 주입
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://localhost:5174}
  image:
    # 프로필 이미지 저장 경로. 로컬 기본값은 작업 디렉터리 하위, 운영은 prod 문서에서 재정의
    base-path: ${APP_IMAGE_BASE_PATH:./data/images/profiles}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
  api:
    base-url: https://kapi.kakao.com
    auth-url: https://kauth.kakao.com

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: desc
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    filter: true
  packages-to-scan: com.voin.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

openai:
  model: gpt-4o
  secret-key: ${OPENAI_API_KEY:}

logging:
  level:
    root: INFO
    com.voin: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# ============================================================
#  local 프로필 (개발용 — H2 인메모리)
# ============================================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:voin_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

---
# ============================================================
#  prod 프로필 (운영용 — PostgreSQL)
#  DB 접속 정보는 환경변수로 주입. ddl-auto 는 TASK 7(Flyway) 에서 validate 로 전환 예정
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voin_db}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # 운영 스키마는 Flyway 마이그레이션으로 관리하고, Hibernate 는 검증만 수행
  flyway:
    enabled: true

  jpa:
    # defer-datasource-initialization 는 Flyway 와 함께 쓰면 순환 의존이 발생하므로 prod 에선 사용하지 않음
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 저장된 프로필 이미지를 URL 로 서빙하기 위한 정적 리소스 매핑(운영 필수)
  # Nginx 를 앞단에 두고 /images/ 를 직접 서빙한다면 이 매핑은 제거 가능
  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:/home/ubuntu/voin/images/

app:
  image:
    base-path: ${APP_IMAGE_BASE_PATH:/home/ubuntu/voin/images/profiles}

# 운영에서는 API 문서를 노출하지 않음 (SecurityConfig 의 경로 차단과 함께 이중 방어)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
# ============================================================
#  test 프로필 (CI/테스트용 — H2)
# ============================================================
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
